buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}
plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-forge${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" { source sourceSets.main; source sourceSets.gameTest }
            }
        }
        client {}
        server { args '--nogui' }
        gameTestServer { workingDirectory project.file('runs/gameTest') }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin {
    add sourceSets.main, 'structure_rewind_watch.refmap.json'
    config 'structure_rewind_watch.mixins.json'
}
jar {
    manifest { attributes('MixinConfigs': 'structure_rewind_watch.mixins.json') }
    finalizedBy 'reobfJar'
}
processResources {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version }
}
if (providers.gradleProperty('rewindCompatibilityTest').isPresent()) {
    minecraft.runs.gameTestServer {
        args '--mixin', 'rewind_compat_test.mixins.json'
        property 'rewind.compatibilityTest', 'true'
    }
}
